name: OCI 免费 ARM 抢机

on:
  schedule:
    # GitHub 的最小粒度是 5 分钟；实际触发可能有几分钟延迟，靠 concurrency 串起来持续跑
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "本次运行的时间预算（秒），默认 20400（约 5 小时 40 分）"
        required: false
        default: "20400"
      interval_seconds:
        description: "两次尝试之间的间隔（秒），默认 90"
        required: false
        default: "90"

permissions:
  contents: read
  issues: write

concurrency:
  group: oci-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 OCI SDK
        run: pip install --quiet oci

      - name: 尝试创建免费 ARM 实例
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          GRAB_NAME: free-arm-1
          GRAB_OCPUS: "1"
          GRAB_MEM_GB: "6"
          GRAB_BOOT_GB: "100"
          GRAB_BUDGET_SECONDS: ${{ inputs.budget_seconds || '20400' }}
          GRAB_INTERVAL: ${{ inputs.interval_seconds || '90' }}
        run: python grab.py | tee result.txt

      - name: 抢到后开 issue 通知
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "RESULT: CREATED" result.txt 2>/dev/null; then
            gh issue create \
              --title "🎉 已抢到免费 ARM 实例" \
              --body "工作流 $(date -u +%FT%TZ) 抢到了实例：$(grep 'RESULT: CREATED' result.txt)" || true
          fi
